# Pings the Render free-tier API so it does not spin down from idle.
# Runs every 10 minutes (Render typically sleeps after ~15 minutes idle).
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake orchestration API
        env:
          RENDER_URL: ${{ vars.RENDER_HEALTH_URL || 'https://orchestration-pqja.onrender.com/health' }}
        run: |
          set -euo pipefail
          echo "Pinging $RENDER_URL"
          # Cold starts can take a while on free tier
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 90 "$RENDER_URL"; then
              echo
              echo "OK (attempt $i)"
              exit 0
            fi
            echo "Attempt $i failed; retrying in 15s..."
            sleep 15
          done
          echo "All wake attempts failed"
          exit 1
